    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <!-- Leaflet Omnivore for KML/GPX/CSV support -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              space: {
                900: '#0B0C15',
                800: '#151725',
                700: '#23263A',
              },
              brand: {
                cyan: '#00F0FF',
                purple: '#7000FF',
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #AAD3DF; /* OSM Water Color */
        color: #1e293b;
      }
      /* Map container fix for z-indexing */
      .leaflet-container {
        background: #AAD3DF;
        z-index: 0;
      }
      .leaflet-pane {
        z-index: 0;
      }
      /* Custom pattern for the map grid - adjusted for light theme */
      .bg-grid-pattern {
        background-image: linear-gradient(to right, #94a3b8 1px, transparent 1px),
                          linear-gradient(to bottom, #94a3b8 1px, transparent 1px);
        background-size: 40px 40px;
      }
    </style>
